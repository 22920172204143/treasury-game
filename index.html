<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小房间探索游戏</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="我的小金库">
</head>
<body>
    <div id="info">
        <h2>💰 我的小金库</h2>
        <p>使用 <strong>WASD</strong> 移动角色 | <strong>鼠标拖拽</strong> 旋转视角</p>
        
        <div class="calendar-section">
            <div class="calendar-header">
                <button id="prevMonth" onclick="changeMonth(-1)">◀</button>
                <span id="currentMonth"></span>
                <button id="nextMonth" onclick="changeMonth(1)">▶</button>
            </div>
            <div id="calendar" class="calendar"></div>
        </div>
        
        <div class="money-input">
            <div class="input-group">
                <label>💵 收入：</label>
                <input type="number" id="income" min="0" step="1" placeholder="0" />
                <span>元</span>
            </div>
            <div class="input-group">
                <label>💸 支出：</label>
                <input type="number" id="expense" min="0" step="1" placeholder="0" />
                <span>元</span>
            </div>
            <div class="input-group">
                <label>📅 日期：</label>
                <input type="date" id="selectedDate" />
            </div>
            <button id="submitBtn" onclick="updateMoney()">✅ 提交</button>
            <button id="setCurrentBtn" onclick="setCurrentMoney()" style="margin-top: 5px; background: linear-gradient(135deg, #ff9800, #f57c00);">💾 设置当前存款</button>
        </div>
        
        <div class="money-status">
            <p>🏦 箱子里的现金：<strong id="totalMoney">0</strong> 元</p>
            <p>📦 完整捆数：<strong id="cashCount">0</strong> 捆</p>
            <p>💵 散钱：<strong id="looseMoney">0</strong> 元</p>
        </div>
    </div>
    
    <div id="container"></div>
    
    <!-- 引入 Three.js (本地文件) -->
    <script src="three.min.js"></script>
    
    <!-- 游戏逻辑 -->
    <script src="game-local.js"></script>
</body>
</html>
